<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Locator - Tema 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Detector IP & Locație</h1>
        
        <div id="rezultat" style="display: none;">
            <img id="steag" src="" alt="Steag Țară" width="100">
            
            <table>
                <tr>
                    <td>IP:</td>
                    <td id="ip">...</td>
                </tr>
                <tr>
                    <td>Oraș:</td>
                    <td id="oras">...</td>
                </tr>
                <tr>
                    <td>Provider (ISP):</td>
                    <td id="isp">...</td>
                </tr>
            </table>
        </div>

        <button id="btn-cauta">Detectează Locația Mea</button>
        <p id="mesaj-status">Apasă pe buton...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
